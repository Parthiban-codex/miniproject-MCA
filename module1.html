<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      background-color: bisque;
      text-align: center;
      font-family: sans-serif;
    }
    h1 {
      color: rgb(0, 0, 0);
    }
    input, button {
      padding: 14px;
      margin: 5px;
    }
    button {
      background-color: rgb(7, 82, 151);
      color: rgb(12, 11, 11);
      border: none;
      cursor: pointer;
    }
    h2, p {
      color: rgb(34, 121, 179);
    }
    h2:hover, p:hover {
      color: rgb(134, 33, 7);
    }
  </style>
</head>
<body>
  <h1>WEATHER DETECTOR </h1>
  <input type="text" id="city" placeholder="Enter the city"><br>
  <button onclick="getWeather()">Get</button>
  <div id="weather"></div>

  <script>
function getWeather() {
  const city = document.getElementById("city").value;
  const apiKey = "1a0421e0a5b5919b5c3123f652d859b0";
  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  document.getElementById("weather").innerHTML = "<p>Wait a minute...</p>";

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (data.cod == 200) {
        const desc = data.weather[0].description;
        const description = desc.charAt(0).toUpperCase() + desc.slice(1);

        const temp = data.main.temp;
        const humidity = data.main.humidity;
        const wind = data.wind.speed;

        let recommendation = "";

        if (description.toLowerCase().includes("rain")) {
          recommendation = "☔ High Risk: Take an umbrella and wear waterproof shoes.";
        } else if (description.toLowerCase().includes("thunderstorm")) {
          recommendation = "⛈️ Danger: Stay indoors and avoid open areas.";
        } else if (description.toLowerCase().includes("snow")) {
          recommendation = "❄️ Wear warm clothes and drive carefully.";
        } else if (temp >= 38) {
          recommendation = "🔥 Very Hot: Drink plenty of water, wear light clothing, and avoid direct sunlight.";
        } else if (temp >= 30) {
          recommendation = "😎 Hot Weather: Stay hydrated and use sunscreen.";
        } else if (temp <= 10) {
          recommendation = "🧥 Cold Weather: Wear a jacket and keep yourself warm.";
        } else if (humidity >= 85) {
          recommendation = "💧 High Humidity: Stay hydrated and avoid strenuous outdoor activities.";
        } else if (wind >= 12) {
          recommendation = "💨 Windy: Secure loose items and be careful while driving.";
        } else if (description.toLowerCase().includes("clear")) {
          recommendation = "🌞 Great Weather: Perfect for outdoor activities.";
        } else if (description.toLowerCase().includes("cloud")) {
          recommendation = "☁️ Pleasant Weather: Enjoy your day, but keep an eye on weather changes.";
        } else {
          recommendation = "✅ Weather looks normal. Have a nice day!";
        }

        document.getElementById("weather").innerHTML = `
          <h2>${data.name}, ${data.sys.country}</h2>
          <p><strong>Temperature:</strong> ${temp}°C</p>
          <p><strong>Humidity:</strong> ${humidity}%</p>
          <p><strong>Wind Speed:</strong> ${wind} m/s</p>
          <p><strong>Condition:</strong> ${description}</p>
          <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="Weather Icon">
          <hr>
          <h3 style="color:green;">Recommendation</h3>
          <p style="font-size:18px;">${recommendation}</p>
        `;
      } else {
        document.getElementById("weather").innerHTML =
          '<p style="color:red;">Wrong city name. Please try again.</p>';
      }
    })
    .catch(() => {
      document.getElementById("weather").innerHTML =
        '<p style="color:red;">Unable to fetch weather data.</p>';
    });
}
</script>

</body>
</html>
